name: ASR Python checks

on:
  push:
    paths:
      - "training/**"
      - ".github/workflows/asr-syntax.yml"
  pull_request:
    paths:
      - "training/**"
      - ".github/workflows/asr-syntax.yml"

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q training/asr

  cpu-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy soundfile sentencepiece
      - name: Run data/model/CTC smoke test
        run: python -m training.asr.smoke_test
