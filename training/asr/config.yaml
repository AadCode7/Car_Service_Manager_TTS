seed: 42

data:
  train_manifest: data/manifests/train-clean-100.jsonl
  valid_manifest: data/manifests/dev-clean.jsonl
  test_manifest: data/manifests/test-clean.jsonl
  tokenizer_model: artifacts/asr/tokenizer.model
  max_train_samples: null
  max_valid_samples: null
  num_workers: 2

audio:
  sample_rate: 16000
  n_fft: 400
  win_length: 400
  hop_length: 160
  n_mels: 80
  f_min: 20.0
  f_max: 7600.0

tokenizer:
  vocab_size: 500
  model_type: unigram

model:
  d_model: 192
  n_heads: 6
  n_layers: 10
  ff_multiplier: 4
  conv_kernel_size: 9
  subsampling_channels: 128
  dropout: 0.10

training:
  epochs: 40
  max_batch_seconds: 48.0
  max_batch_size: 16
  grad_accum_steps: 2
  learning_rate: 0.0003
  min_learning_rate: 0.00002
  weight_decay: 0.01
  warmup_steps: 1000
  max_grad_norm: 5.0
  amp: true
  amp_dtype: float16
  spec_augment: true
  freq_masks: 2
  freq_mask_width: 15
  time_masks: 2
  time_mask_width: 30
  speed_perturb: true
  speed_perturb_rates: [0.9, 1.0, 1.1]
  use_ema: true
  ema_decay: 0.999
  early_stopping_patience: 8
  log_every_steps: 50
  save_every_epoch: true
  checkpoint_every_steps: 300
  max_valid_batches: null

output:
  directory: artifacts/asr
